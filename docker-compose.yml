services:
  app:
    build: .
    image: json-schema-form-builder:latest
    container_name: jsf-builder
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DB_PATH: /app/data/app.db
    volumes:
      - jsf-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 4s
      retries: 5

volumes:
  jsf-data:
